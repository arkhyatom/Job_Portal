{% extends "base.html" %}

{% block title %}Log in | JobPortal{% endblock %}

{% block content %}
<div class="container">
    <div class="card form-card">
        <h2>Log in</h2>
        <form method="post">
            {% csrf_token %}
            {{ form.as_p }}
            <input type="hidden" name="next" value="{{ next }}">
            <button class="btn btn-dark full" type="submit">Log in</button>
        </form>
        <p class="muted">New here?
            <a class="link" href="{% url 'register_candidate' %}">Sign up as a job seeker</a> or
            <a class="link" href="{% url 'register_employer' %}">as an employer</a>.
        </p>
    </div>
</div>
{% endblock %}
