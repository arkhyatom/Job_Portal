{% extends "base.html" %}

{% block title %}{{ title }} | JobPortal{% endblock %}

{% block content %}
<div class="container">
    <div class="card form-card">
        <h2>{{ title }}</h2>
        <form method="post" enctype="multipart/form-data">
            {% csrf_token %}
            {{ form.as_p }}
            <button class="btn btn-dark full" type="submit">Create account</button>
        </form>
        <p class="muted">Already have an account? <a class="link" href="{% url 'login' %}">Log in</a></p>
    </div>
</div>
{% endblock %}
